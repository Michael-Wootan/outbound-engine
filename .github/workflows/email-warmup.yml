name: Email Domain Warmup

on:
  schedule:
    - cron: '0 14 * * *'    # daily during the warmup period, 14:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: run warmup, check status, or reset'
        required: false
        default: 'run'
        type: choice
        options:
          - run
          - status
          - reset

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 180    # warmup takes up to 2.5 hours at full volume (20 emails x 5 min gaps)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Restore warmup state from previous runs
      - name: Restore warmup state
        uses: actions/cache@v4
        with:
          path: state/email-warmup-state.json
          key: email-warmup-state-${{ github.run_number }}
          restore-keys: |
            email-warmup-state-

      - name: Run email warmup
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.action }}" = "status" ]; then
            FLAGS="--status"
          elif [ "${{ github.event.inputs.action }}" = "reset" ]; then
            FLAGS="--reset"
          fi
          node src/email-warmup.js $FLAGS
        env:
          OUTREACH_SMTP_HOST:  ${{ secrets.OUTREACH_SMTP_HOST }}
          OUTREACH_SMTP_PORT:  ${{ secrets.OUTREACH_SMTP_PORT }}
          OUTREACH_SMTP_USER:  ${{ secrets.OUTREACH_SMTP_USER }}
          OUTREACH_SMTP_PASS:  ${{ secrets.OUTREACH_SMTP_PASS }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_NOTIFY:        ${{ secrets.EMAIL_NOTIFY }}

      # Save state for next run
      - name: Save warmup state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/email-warmup-state.json
          key: email-warmup-state-${{ github.run_number }}
